# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build and Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm run compile
    - run: npm run compile-browser
    - run: npm run tests-unit
    # - run: npm run tests-devnet  TODO: Enable this later

  # Builds the tarball that would be published, installs it into an empty project and checks
  # that a consumer can type-check against it and run it. See package-tests/run.sh.
  package:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run test-package
